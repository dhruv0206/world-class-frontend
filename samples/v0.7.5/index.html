<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIKK Inspired Sample</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1F1F1;
            color: #111111;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .grid-bg {
            background-size: 100px 100px;
            background-image:
                linear-gradient(to right, #D1D1D1 1px, transparent 1px),
                linear-gradient(to bottom, #D1D1D1 1px, transparent 1px);
        }

        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        .bg-text {
            font-size: 20vw;
            color: rgba(0,0,0,0.03);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
            font-weight: 700;
        }
        
        .diagonal-accent {
            position: absolute;
            background: #4A6FFF;
            transform: skewX(-20deg);
            z-index: 1;
        }
    </style>
</head>
<body class="grid-bg min-h-screen flex flex-col relative">
    <div class="bg-text tracking-tighter">FESTIVAL</div>
    
    <header class="border-b border-[#D1D1D1] bg-[#F1F1F1] relative z-10 flex justify-between items-center px-8 py-6 uppercase tracking-widest text-sm font-medium">
        <div>KIKK ASBL</div>
        <nav class="flex gap-8">
            <a href="#" class="hover:text-[#4A6FFF]">About</a>
            <a href="#" class="hover:text-[#4A6FFF]">Projects</a>
            <a href="#" class="hover:text-[#4A6FFF]">Contact</a>
        </nav>
    </header>

    <main class="flex-1 flex relative z-10">
        <aside class="w-24 border-r border-[#D1D1D1] flex flex-col items-center py-12">
            <div class="vertical-text text-sm tracking-widest text-[#666666]">002 — ABOUT</div>
        </aside>

        <section class="flex-1 p-24 relative overflow-hidden">
            <div class="diagonal-accent w-[800px] h-[200px] -top-10 -left-20 opacity-20"></div>
            
            <h1 class="text-7xl font-bold uppercase tracking-tight mb-8 max-w-4xl leading-none relative z-10">
                Exploring the intersection of art, science & technology
            </h1>
            
            <p class="text-lg text-[#333333] max-w-xl leading-relaxed mb-12 relative z-10">
                A gathering of creative coders, designers, and innovators pushing the boundaries of digital experiences. We believe in raw structural aesthetics and geometric precision.
            </p>
            
            <button class="bg-[#111111] text-white px-8 py-4 uppercase tracking-widest text-sm font-medium hover:bg-[#4A6FFF] transition-colors relative z-10">
                Discover Program
            </button>
        </section>
    </main>
</body>
</html>
